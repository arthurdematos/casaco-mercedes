
<body>

    <h1>Teste de Câmeras</h1>

    <p id="status">Solicitando acesso às câmeras...</p>

    <div>
        <video id="frontal" autoplay playsinline></video>
        <video id="traseira" autoplay playsinline></video>
    </div>

    <script>
        const frontal = document.getElementById("frontal");
        const traseira = document.getElementById("traseira");
        const status = document.getElementById("status");

        async function iniciarCamera() {
            try {

                // Câmera frontal
                const streamFrontal =
                    await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: "user"
                        },
                        audio: false
                    });

                frontal.srcObject = streamFrontal;


                // Câmera traseira
                const streamTraseira =
                    await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: {
                                exact: "environment"
                            }
                        },
                        audio: false
                    });

                traseira.srcObject = streamTraseira;

                status.textContent = "Câmeras ativas";

            } catch (erro) {

                console.error(erro);

                status.textContent =
                    "Não foi possível acessar as duas câmeras. Verifique as permissões.";

            }
        }

        iniciarCamera();
    </script>

</body>
</html>
