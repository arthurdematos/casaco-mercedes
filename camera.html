<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Câmera</title>
</head>

<body>

    <h1>Teste de câmera</h1>

    <p id="status">Aguardando permissão...</p>

    <video
        id="video"
        autoplay
        playsinline
        muted
        width="400">
    </video>

    <script>
        const video = document.getElementById("video");
        const status = document.getElementById("status");

        async function iniciarCamera() {

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: false
                    });

                video.srcObject = stream;

                status.textContent =
                    "Câmera autorizada e funcionando.";

            } catch (erro) {

                console.error(erro);

                status.textContent =
                    "Permissão da câmera recusada ou indisponível.";
            }
        }

        iniciarCamera();
    </script>

</body>
</html>
