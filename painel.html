<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Painel</title>

    <style>

        body {

            font-family: Arial, sans-serif;

            background: #111;

            color: white;

            text-align: center;

            padding: 25px;

        }

        .cameras {

            display: flex;

            gap: 20px;

            justify-content: center;

            flex-wrap: wrap;

        }

        .camera {

            background: #222;

            padding: 10px;

            border-radius: 10px;

        }

        video {

            width: 450px;

            max-width: 90vw;

            background: black;

        }

        button {

            margin-top: 20px;

            padding: 12px 20px;

            font-size: 16px;

            cursor: pointer;

        }

    </style>

</head>


<body>

    <h1>Painel</h1>

    <p id="status">
        Conectando...
    </p>


    <div class="cameras">

        <div class="camera">

            <h2>Câmera frontal</h2>

            <video
                id="frontVideo"
                autoplay
                playsinline>
            </video>

        </div>


        <div class="camera">

            <h2>Câmera traseira</h2>

            <video
                id="rearVideo"
                autoplay
                playsinline>
            </video>

        </div>

    </div>


    <!-- Áudio recebido -->

    <audio
        id="audio"
        autoplay>
    </audio>


    <br>

    <button id="iniciar">
        🔊 Iniciar visualização
    </button>

    <button id="encerrar">
        ⛔ Encerrar transmissão
    </button>


<script>

const status =
    document.getElementById("status");

const frontVideo =
    document.getElementById("frontVideo");

const rearVideo =
    document.getElementById("rearVideo");

const audio =
    document.getElementById("audio");

const iniciar =
    document.getElementById("iniciar");

const encerrar =
    document.getElementById("encerrar");


const socket = new WebSocket(
    "wss://casaco-mercedes.onrender.com"
);


let peer = null;

let quantidadeVideos = 0;


socket.onopen = () => {

    status.textContent =
        "Conectado. Aguardando câmera...";


    peer = new RTCPeerConnection({

        iceServers: [
            {
                urls:
                    "stun:stun.l.google.com:19302"
            }
        ]

    });


    peer.ontrack = evento => {

        const track =
            evento.track;


        if (track.kind === "video") {

            quantidadeVideos++;


            const stream =
                new MediaStream([track]);


            if (quantidadeVideos === 1) {

                frontVideo.srcObject =
                    stream;

                status.textContent =
                    "Câmera frontal recebida.";

            }

            else if (quantidadeVideos === 2) {

                rearVideo.srcObject =
                    stream;

                status.textContent =
                    "Câmeras frontal e traseira recebidas.";

            }

        }


        if (track.kind === "audio") {

            const stream =
                new MediaStream([track]);

            audio.srcObject =
                stream;

        }

    };


    peer.onicecandidate = evento => {

        if (evento.candidate) {

            socket.send(JSON.stringify({

                tipo: "candidato",

                candidato:
                    evento.candidate

            }));

        }

    };


    socket.send(JSON.stringify({

        tipo: "painel"

    }));

};


socket.onmessage = async evento => {

    const mensagem =
        JSON.parse(evento.data);


    if (mensagem.tipo === "oferta") {

        await peer.setRemoteDescription(
            mensagem.oferta
        );


        const resposta =
            await peer.createAnswer();


        await peer.setLocalDescription(
            resposta
        );


        socket.send(JSON.stringify({

            tipo: "resposta",

            resposta:
                peer.localDescription

        }));

    }


    if (mensagem.tipo === "candidato") {

        try {

            await peer.addIceCandidate(
                mensagem.candidato
            );

        } catch (erro) {

            console.error(erro);

        }

    }

};


iniciar.onclick = async () => {

    try {

        await frontVideo.play();

        await rearVideo.play();

        await audio.play();

        status.textContent =
            "Visualização e áudio iniciados.";

    } catch (erro) {

        console.error(erro);

        status.textContent =
            "Clique novamente para iniciar o áudio.";

    }

};


encerrar.onclick = () => {

    socket.send(JSON.stringify({

        tipo: "encerrar"

    }));


    if (peer) {

        peer.close();

    }


    frontVideo.srcObject = null;

    rearVideo.srcObject = null;

    audio.srcObject = null;


    status.textContent =
        "Transmissão encerrada.";

};


socket.onerror = () => {

    status.textContent =
        "Erro ao conectar ao servidor.";

};


socket.onclose = () => {

    if (
        !status.textContent.includes("encerrada")
    ) {

        status.textContent =
            "Servidor desconectado.";

    }

};

</script>

</body>

</html>
