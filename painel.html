<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Painel</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
            padding: 30px;
        }

        video {
            width: 90%;
            max-width: 800px;
            background: black;
        }

        button {
            margin: 10px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Painel de visualização</h1>

    <p id="status">Conectando...</p>

    <video
        id="video"
        autoplay
        playsinline>
    </video>

    <br>

    <button id="iniciar">
        Iniciar visualização
    </button>

    <button id="encerrar">
        Encerrar transmissão
    </button>

    <script>

        const video =
            document.getElementById("video");

        const status =
            document.getElementById("status");

        const iniciar =
            document.getElementById("iniciar");

        const encerrar =
            document.getElementById("encerrar");


        const socket = new WebSocket(
            "wss://casaco-mercedes.onrender.com"
        );


        let peer = null;


        function criarPeer() {

            peer = new RTCPeerConnection({
                iceServers: [
                    {
                        urls:
                            "stun:stun.l.google.com:19302"
                    }
                ]
            });


            peer.ontrack = evento => {

                video.srcObject =
                    evento.streams[0];

                status.textContent =
                    "Transmissão recebida.";
            };


            peer.onicecandidate = evento => {

                if (evento.candidate) {

                    socket.send(JSON.stringify({
                        tipo: "candidato",
                        candidato:
                            evento.candidate
                    }));
                }
            };
        }


        socket.onopen = () => {

            status.textContent =
                "Conectado. Aguardando câmera...";

            criarPeer();

            socket.send(JSON.stringify({
                tipo: "painel"
            }));
        };


        socket.onmessage = async evento => {

            const mensagem =
                JSON.parse(evento.data);


            if (mensagem.tipo === "oferta") {

                await peer.setRemoteDescription(
                    mensagem.oferta
                );


                const resposta =
                    await peer.createAnswer();


                await peer.setLocalDescription(
                    resposta
                );


                socket.send(JSON.stringify({
                    tipo: "resposta",
                    resposta:
                        peer.localDescription
                }));
            }


            if (mensagem.tipo === "candidato") {

                try {

                    await peer.addIceCandidate(
                        mensagem.candidato
                    );

                } catch (erro) {

                    console.error(erro);
                }
            }
        };


        iniciar.onclick = async () => {

            try {

                await video.play();

                status.textContent =
                    "Visualização iniciada.";

            } catch (erro) {

                console.error(erro);

                status.textContent =
                    "Clique novamente para iniciar.";
            }
        };


        encerrar.onclick = () => {

            socket.send(JSON.stringify({
                tipo: "encerrar"
            }));

            if (peer) {
                peer.close();
            }

            video.srcObject = null;

            status.textContent =
                "Transmissão encerrada.";
        };


        socket.onerror = () => {

            status.textContent =
                "Erro ao conectar ao servidor.";
        };


        socket.onclose = () => {

            status.textContent =
                "Servidor desconectado.";
        };

    </script>

</body>
</html>
