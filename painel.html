<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel - PoC</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #111;
            color: white;
            margin: 0;
            padding: 30px;
        }

        h1 {
            margin-bottom: 10px;
        }

        #status {
            margin-bottom: 20px;
        }

        video {
            width: 90%;
            max-width: 800px;
            background: black;
            border-radius: 10px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Painel de visualização</h1>

    <p id="status">Conectando...</p>

    <video
        id="video"
        autoplay
        playsinline>
    </video>

    <br>

    <button id="encerrar">
        Encerrar transmissão
    </button>

    <script>

        const video = document.getElementById("video");
        const status = document.getElementById("status");
        const botaoEncerrar = document.getElementById("encerrar");


        // Conecta ao servidor de sinalização
        const socket = new WebSocket(
            "ws://" + window.location.host
        );


        // Cria a conexão WebRTC
        const conexao = new RTCPeerConnection();


        // Quando receber o vídeo da câmera
        conexao.ontrack = (evento) => {

            video.srcObject = evento.streams[0];

            status.textContent =
                "Transmissão recebida.";
        };


        // Envia candidatos WebRTC
        conexao.onicecandidate = (evento) => {

            if (evento.candidate) {

                socket.send(JSON.stringify({
                    tipo: "candidato",
                    candidato: evento.candidate
                }));

            }

        };


        // Quando conectar ao servidor
        socket.onopen = () => {

            status.textContent =
                "Conectado. Aguardando câmera...";

            socket.send(JSON.stringify({
                tipo: "painel-pronto"
            }));

        };


        // Recebe mensagens do servidor
        socket.onmessage = async (evento) => {

            const mensagem = JSON.parse(evento.data);


            // Recebe a oferta da câmera
            if (mensagem.tipo === "oferta") {

                await conexao.setRemoteDescription(
                    mensagem.oferta
                );


                const resposta =
                    await conexao.createAnswer();


                await conexao.setLocalDescription(
                    resposta
                );


                socket.send(JSON.stringify({
                    tipo: "resposta",
                    resposta: resposta
                }));

            }


            // Recebe candidato WebRTC
            if (mensagem.tipo === "candidato") {

                await conexao.addIceCandidate(
                    mensagem.candidato
                );

            }

        };


        // Botão para encerrar a transmissão
        botaoEncerrar.onclick = () => {

            socket.send(JSON.stringify({
                tipo: "encerrar"
            }));

            conexao.close();

            video.srcObject = null;

            status.textContent =
                "Transmissão encerrada.";

        };

    </script>

</body>

</html>
